<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Daddy Ko</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
}

.card{
    background:#1e293b;
    width:100%;
    max-width:600px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 30px rgba(59,130,246,.3);
}

h1{
    color:#60a5fa;
    margin-bottom:20px;
}

p{
    line-height:1.8;
}

button{
    background:#3b82f6;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:10px;
    cursor:pointer;
    margin:8px;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#2563eb;
}

input{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:10px;
    text-align:center;
    font-size:16px;
}

#popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:20px;
}

.popup-card{
    background:#1e293b;
    width:100%;
    max-width:400px;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

.hidden{
    display:none !important;
}

#emojiRain{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.emoji{
    position:absolute;
    font-size:35px;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}

.loading{
    text-align:left;
    margin-top:20px;
}

@media(max-width:500px){

    .card{
        padding:22px;
    }

    h1{
        font-size:26px;
    }

    button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="card" id="mainCard">

<h1>🎉 Happy Birthday, Daddy Ko! 🎉</h1>

<p>

Happy Birthday, Daddy Ko ❤️

<br><br>

Thank you for being my favorite person, my safe place,
my best friend, and the best husband.

Today is all about celebrating YOU.

<br><br>

But before claiming your reward...

We need to verify your identity.

</p>

<br>

<button onclick="startVerification()">
CLICK HERE
</button>

</div>

<div id="emojiRain"></div>

<div id="popup" class="hidden">

    <div class="popup-card">

        <h2 id="popupTitle"></h2>

        <br>

        <p id="popupText"></p>

        <input
            id="birthdayInput"
            class="hidden"
            placeholder="MM/DD or Month Day"
        >

        <br><br>

        <div id="popupButtons"></div>

    </div>

</div>

<script>

const CANVA_LINK = "PASTE-YOUR-CANVA-LINK-HERE";

function startVerification(){

    document.getElementById("popup").classList.remove("hidden");

    document.getElementById("popupTitle").innerText =
    "🔒 HUSBAND AUTHENTICATION SYSTEM";

    document.getElementById("popupText").innerText =
    "Are you Iah's husband?";

    document.getElementById("birthdayInput")
    .classList.add("hidden");

    document.getElementById("popupButtons").innerHTML=`
        <button onclick="showBirthdayQuestion()">YES</button>
        <button onclick="showAngryMode()">NO</button>
    `;
}

function showBirthdayQuestion(){

    document.getElementById("popupTitle").innerText =
    "🛡️ IDENTITY VERIFICATION";

    document.getElementById("popupText").innerText =
    "When is your birthday?";

    document.getElementById("birthdayInput")
    .classList.remove("hidden");

    document.getElementById("popupButtons").innerHTML=`
        <button onclick="checkBirthday()">OK</button>
    `;
}

function checkBirthday(){

    let value =
    document.getElementById("birthdayInput")
    .value
    .trim()
    .toLowerCase();

    if(
        value==="12/3" ||
        value==="dec 3" ||
        value==="december 3"
    ){

        showLoveQuestion();

    }else{

        alert("⚠️ Suspicious user detected. Try again.");
    }

}

function showLoveQuestion(){

    document.getElementById("birthdayInput")
    .classList.add("hidden");

    document.getElementById("popupTitle").innerText =
    "❤️ FINAL SECURITY CHECK";

    document.getElementById("popupText").innerText =
    "DO YOU LOVE YOUR WIFE?";

    document.getElementById("popupButtons").innerHTML=`
        <button onclick="showSuccess()">YES</button>
        <button onclick="showSuccess()">OF COURSE</button>
    `;
}

function showSuccess(){

    document.getElementById("popup")
    .classList.add("hidden");

    document.getElementById("mainCard").innerHTML=`

    <h1>✅ AUTHENTICATION SUCCESSFUL</h1>

    <p>

    Identity Verified ✅

    <br><br>

    Husband Status: CONFIRMED

    <br>

    Love Level: 100%

    <br>

    Husband License: VALID

    <br>

    Wife Satisfaction Index: 99%

    <br><br>

    Warning:

    User requires hugs immediately.

    <br><br>

    Congratulations!

    You passed all security checks.

    </p>

    <br>

    <button onclick="showReward()">
    CLAIM REWARD
    </button>

    `;
}

function showReward(){

    document.getElementById("mainCard").innerHTML=`

    <h1>🎁 REWARD UNLOCKED</h1>

    <div id="loading" class="loading"></div>

    `;
    
    let lines = [
        "Verifying husband credentials... ✅",
        "Loading birthday package... ✅",
        "Loading memories... ✅",
        "Loading wife.exe... ✅",
        "Launching surprise... 🚀"
    ];

    let i = 0;

    let timer = setInterval(()=>{

        document.getElementById("loading").innerHTML +=
        lines[i] + "<br><br>";

        i++;

        if(i >= lines.length){

            clearInterval(timer);

            setTimeout(()=>{

                window.location.href = https://happy-daddae-day.my.canva.site;

            },2000);

        }

    },1000);

}

function showAngryMode(){

    document.getElementById("popup")
    .classList.add("hidden");

    document.body.style.background="#7f1d1d";

    document.getElementById("mainCard").innerHTML=`

    <h1>😡 ACCESS DENIED</h1>

    <p>

    Nice try.

    <br><br>

    Only Iah's husband may proceed.

    </p>

    <br>

    <button onclick="location.reload()">
        TRY AGAIN
    </button>

    `;

    const rain = document.getElementById("emojiRain");

    rain.innerHTML = "";

    for(let i=0;i<100;i++){

        let emoji = document.createElement("div");

        emoji.className="emoji";

        emoji.innerText="😡";

        emoji.style.left=Math.random()*100+"vw";

        emoji.style.animationDuration=
        (Math.random()*3+2)+"s";

        rain.appendChild(emoji);
    }

}

</script>

</body>
</html>
